[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protegid-api"
version = "0.1.0"
description = "ProtegID FastAPI backend and worker base."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
